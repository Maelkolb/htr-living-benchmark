# D5 tile, in the order printed: profile.csv [s_per_page, price_usd_per_page in cents, hardware_class].
# "<0.1" is the printed "< 0.1 ¢"; the hardware column prints the class as "laptop CPU", "GPU 8 GB", "API", "web app".
efficiency_tile:
  kraken-kurrent-xix: [1.3, "<0.1", cpu]
  trocr-kurrent-xvi-xvii: [4.2, "<0.1", gpu_8gb]
  paddleocr-vl-1.6: [12.7, "<0.1", gpu_8gb]
  olmocr-2-7b: [13.3, "<0.1", gpu_24gb]
  gemini-3.5-flash: [3.9, 0.6, api]
  claude-sonnet-5: [14.2, 1.5, api]
  transkribus-german-genius: [11.1, 26, transkribus]
  transkribus-text-titan-ii: [14.8, 26, transkribus]

# "A reader's view": judge.csv share_misleading (first pass), per cent
judge_panel_misleading:
  paddleocr-vl-1.6: 19
  transkribus-german-genius: 22
  kraken-kurrent-xix: 23
  gemini-3.5-flash: 25
  trocr-kurrent-xvi-xvii: 29
  transkribus-text-titan-ii: 31
  claude-sonnet-5: 53
  olmocr-2-7b: 57

# Sentences of the tiles and the take-homes: [system_id, column, printed value, format]; "pct" columns are printed as per cent
statements:
  - [transkribus-german-genius, char_accuracy, 82.0, pct1]   # "gets 82.0 % of the page's characters right"
  - [paddleocr-vl-1.6, char_accuracy, 33.8, pct1]
  - [gemini-3.5-flash, word_accuracy, 62.5, pct1]
  - [paddleocr-vl-1.6, word_accuracy, 6.5, pct1]
  - [gemini-3.5-flash, glyph_f1, 0.35, dec2]                  # "glyph F1 0.35 (Gemini 3.5 Flash) to 0.00 (olmOCR-2 7B)"
  - [olmocr-2-7b, glyph_f1, 0.00, dec2]
  - [gemini-3.5-flash, punct_kept, 77, pct0]                  # "Punctuation survives for 77–37 % of the marks"
  - [olmocr-2-7b, punct_kept, 37, pct0]
  - [gemini-3.5-flash, caps_kept, 96, pct0]                   # "capitals for 96–85 %"
  - [trocr-kurrent-xvi-xvii, caps_kept, 85, pct0]
  - [gemini-3.5-flash, judge_misleading, 23, pct0]            # "the judge rated 23 % misleading" (both passes)
  - [olmocr-2-7b, judge_misleading, 56, pct0]
  - [gemini-3.5-flash, numeral_f1, 81, pct0]                  # "Numbers: Gemini 3.5 Flash keeps 81 %"
  - [kraken-kurrent-xix, numeral_f1, 22, pct0]
  - [olmocr-2-7b, cer_page, 60.2, pct1]                       # take-home 2: "gets 60.2 % of the page wrong"
  - [gemini-3.5-flash, real_word_share, 69, pct0]             # take-home 3
  - [kraken-kurrent-xix, real_word_share, 40, pct0]

# Ranges quoted on the tiles hold over the line-up: the first system has the maximum, the second the minimum.
extremes:
  char_accuracy: [transkribus-german-genius, paddleocr-vl-1.6]
  word_accuracy: [gemini-3.5-flash, paddleocr-vl-1.6]
  fidelity: [gemini-3.5-flash, paddleocr-vl-1.6]
  integrity: [gemini-3.5-flash, olmocr-2-7b]
  efficiency: [kraken-kurrent-xix, transkribus-text-titan-ii]
  glyph_f1: [gemini-3.5-flash, olmocr-2-7b]
  punct_kept: [gemini-3.5-flash, olmocr-2-7b]
  caps_kept: [gemini-3.5-flash, trocr-kurrent-xvi-xvii]

# Take-home 1: the system with the highest character accuracy per corpus, among systems that read every page of it
corpus_winners:
  abp: transkribus-german-genius
  humboldt: gemini-3.5-flash
  forst: gemini-3.5-flash
  laubmann: gemini-3.5-flash

# The corpus cards print the span of the archival series the pages were drawn from, not of the 86 pages: the
# Ratsprotokolle of the release begin in 1736, its Humboldt pages end in 1799. The check requires every page the
# manifest dates to fall inside the printed range; the forest and Laubmann pages carry no year (docs/DATASETS.md).
corpus_years:
  abp: [1710, 1803]
  humboldt: [1790, 1805]
  forst: [1857, 1895]
  laubmann: [1917, 1965]

# Lines quoted on the poster; `line` counts the reference's non-empty lines from 0. `ref` is the reference line
# printed beside the reading and `text` the reading itself, which the check looks up in the archived run, matched
# to that reference line. `cer` and `wer` are the rates printed next to it (tier L1, per cent), `verdict` the
# judge's verdict on that line in its first pass, `spans` the differences the judge listed.
#
# Two places where the poster sets a quoted line differently from the release, without changing what it says:
# the opening example runs the two Humboldt lines together, and the D3 tile drops the line-final hyphen marker
# "[-]" that the D1/D2 tile keeps on the sibling line of the same page.
quotes:
  - {system: gemini-3.5-flash, page: humboldt_england1790_8r, line: 3,
     ref: "die in Deutschland nur bei", text: "die in Deutschland nur bei"}
  - {system: gemini-3.5-flash, page: humboldt_england1790_8r, line: 4,
     ref: "Harzburg am Harze entdekt", text: "Harzburg am Wege entdeckt"}
  - {system: transkribus-text-titan-ii, page: humboldt_england1790_8r, line: 3,
     ref: "die in Deutschland nur bei", text: "die in Deutschland im bei"}
  - {system: transkribus-text-titan-ii, page: humboldt_england1790_8r, line: 4,
     ref: "Harzburg am Harze entdekt", text: "Herzberg am Hage entdekt."}
  - {system: gemini-3.5-flash, page: ABP_B5_1739_00310, line: 5,
     ref: "Concʆ: Sub Consuetis clausu[-]", text: "Concl: Sub Consuetis clausulis", cer: 14, wer: 50}
  - {system: trocr-kurrent-xvi-xvii, page: ABP_B5_1739_00310, line: 5,
     ref: "Concʆ: Sub Consuetis clausu[-]", text: "Concl . sub consuetis clausulis", cer: 29, wer: 100}
  - {system: transkribus-text-titan-ii, page: ABP_B5_1739_00310, line: 5,
     ref: "Concʆ: Sub Consuetis clausu[-]", text: "Concl. Sub Consuetis clausus", cer: 11, wer: 50}
  - {system: gemini-3.5-flash, page: ABP_B5_1739_00310, line: 19,
     ref: "ſeeʆ geweſte Köchin außgeſaget d[-]", text: "praef: geweste Köchin außgesaget, dß"}
  - {system: kraken-kurrent-xix, page: ABP_B5_1739_00310, line: 19,
     ref: "ſeeʆ geweſte Köchin außgeſaget d[-]", text: "ras gereſte. Lachm außgeſuget u."}
  - {system: transkribus-text-titan-ii, page: ABP_B5_1739_00310, line: 19,
     ref: "ſeeʆ geweſte Köchin außgeſaget d[-]", text: "seel geweste Köchin außgesaget, da"}
  - {system: gemini-3.5-flash, page: humboldt_america1799_10r, line: 8,
     ref: "findet. Das Mittel ist übrigens alt. In Chile hat man",
     text: "Stadt d. Viertel iſt übrigens alt. Im Thale hat man", verdict: misleading}
  # The sentence the poster prints under this example summarises the judge's note; the judge's own words are
  # "The machine transcription hallucinates a day, garbles the month, misreads the year, and severely distorts
  # the city name." The four spans beside it are quoted verbatim and are checked.
  - {system: kraken-kurrent-xix, page: laubmann03_0131_R, line: 0,
     ref: "Januar 1923. München.", text: "15. Janiar is3. munmen.", verdict: misleading,
     spans: [["15. Janiar", hallucinated_insertion, 1], ["Janiar", garble, 1], ["is3.", number_error, 2], ["munmen.", name_error, 2]]}
