# Every number printed on poster_final.pdf, transcribed from the poster and keyed to the table cell it comes from.
# `htrbench check-poster` recomputes nothing: it compares these values with results/tables, rounded as printed.

counts:                      # header, "How this benchmark works", "The material"
  pages: 86                  # corpora.csv, sum of n_pages
  corpora: 4
  reference_lines: 2633      # corpora.csv, sum of n_lines
  systems: 20                # profile.csv, rows
  open_weight_page_readers_on_all_pages: 7   # profile.csv: family vlm_open_local with n_pages = 86 (take-home 2)
  best_open_weight_page_reader: olmocr-2-7b  # the one of those seven with the lowest whole-page CER
  corpus_cards:              # corpora.csv: [n_pages, n_lines]
